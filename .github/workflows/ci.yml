name: CI - Nginx Gateway (FS-NginxGateway)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-nginx:
    name: Validate Nginx Config Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/*.conf') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Test Nginx Configuration
        run: |
          if [ -f "nginx.conf" ]; then
            sudo mkdir -p /tmp/nginx-cache/games /tmp/nginx-cache/proxy
            sudo nginx -t
          else
            echo "No nginx.conf found at root level, skipping syntax check."
          fi
