name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Decode & copy SSL certs to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            sudo mkdir -p /opt/nginx-ssl
            sudo chmod 700 /opt/nginx-ssl
          EOF

          echo "${{ secrets.SSL_CERT }}" | base64 -d > /tmp/origin-cert.pem
          echo "${{ secrets.SSL_KEY }}" | base64 -d > /tmp/origin-key.key

          scp /tmp/origin-cert.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nginx-ssl/
          scp /tmp/origin-key.key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nginx-ssl/

          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            sudo chmod 644 /opt/nginx-ssl/origin-cert.pem
            sudo chmod 600 /opt/nginx-ssl/origin-key.key
          EOF

      - name: Pull latest image & restart gateway
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /opt/feryshop
            docker compose -f docker-compose.prod.yml pull gateway
            docker compose -f docker-compose.prod.yml up -d gateway
          EOF
