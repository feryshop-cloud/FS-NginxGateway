worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # Trust proxy/load balancer headers from private network ranges
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;   # Railway private network/CGNAT range
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zones
    # api: 10 requests/sec for public API endpoints
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # admin: 5 requests/sec to prevent brute-force attacks on admin dashboard (/admin)
    limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
    # general: 30 requests/sec for general storefront traffic
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    client_max_body_size 20M;

    # Custom JSON log format to track request and upstream rendering/processing times
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time_sec":$request_time,'
        '"upstream_response_time_sec":"$upstream_response_time",'
        '"upstream_connect_time_sec":"$upstream_connect_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"x_request_id":"$http_x_request_id"'
    '}';

    access_log /dev/stdout json_analytics;
    error_log /var/log/nginx/error.log warn;

    # Proxy cache for game assets (/api/storage)
    proxy_cache_path /tmp/nginx-cache/games levels=1:2 keys_zone=games_assets:10m max_size=100m inactive=7d use_temp_path=off;

    # Proxy cache for proxied images (/api/proxy-image)
    proxy_cache_path /tmp/nginx-cache/proxy levels=1:2 keys_zone=api_proxy:10m max_size=100m inactive=7d use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
